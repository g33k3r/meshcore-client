name: Build

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/settings.gradle', 'android/app/build.gradle', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Write dart_defines.json
        env:
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
        run: jq -n --arg k "$GIPHY_API_KEY" '{GIPHY_API_KEY:$k}' > dart_defines.json
      - run: flutter build apk --release --no-pub --dart-define-from-file=dart_defines.json
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: offband-android-r${{ github.run_number }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  # Stable-signature Android build for the GeekCore field kit.
  # Same keystore every time => APKs install OVER previous ones (no uninstall).
  # SECURITY (repo is PUBLIC): workflow_dispatch ONLY — the keystore secrets
  # must never be exposed to pull_request runs (see release-signed.yml notes).
  android-signed:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # release page updates (GITHUB_TOKEN, never a PAT)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/settings.gradle', 'android/app/build.gradle', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Write dart_defines.json
        env:
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
        run: jq -n --arg k "$GIPHY_API_KEY" '{GIPHY_API_KEY:$k}' > dart_defines.json
      - name: Restore signing keystore
        env:
          KS_B64: ${{ secrets.GEEKCORE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.GEEKCORE_KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.GEEKCORE_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.GEEKCORE_KEY_PASS }}
        run: |
          echo "$KS_B64" | base64 -d > android/geekcore-kit.keystore
          printf 'storeFile=%s/android/geekcore-kit.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$PWD" "$KS_PASS" "$KS_ALIAS" "$KS_KEYPASS" > android/key.properties
      - run: flutter build apk --release --no-pub --dart-define-from-file=dart_defines.json
      - name: Remove keystore material
        if: always()
        run: rm -f android/geekcore-kit.keystore android/key.properties
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: geekcore-signed-r${{ github.run_number }}-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Update releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="geekcore-$(date -u +%Y%m%d)"
          RUN="r${{ github.run_number }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          SUBJECT="$(git log -1 --pretty=%s)"
          ASSET="geekcore-${RUN}-signed.apk"
          TITLE="GeekCore ${RUN} — ${SUBJECT}"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          # upload under the r-numbered filename (download name matters, labels don't)
          cp "$APK" "$ASSET"

          {
            echo "Signed GeekCore field-kit build (stable keystore — installs in place over previous signed builds, no uninstall)."
            echo
            echo "**Build:** ${RUN} · ${SHORT_SHA} · built $(date -u +%Y-%m-%d)"
            echo "**Firmware:** app-only updates never need a Heltec reflash."
            echo
            echo "### Recent changes"
            git log -8 --pretty=format:'- %h %s'
          } > release-notes.md

          # Single rolling release, date-tagged: roll to today's tag when it changes
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            for old in $(gh release list -R "$GITHUB_REPOSITORY" --json tagName -q '.[].tagName' \
                         | grep -E '^geekcore-[0-9]{8}$' | grep -v "^${TAG}$" || true); do
              gh release delete "$old" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag
            done
            gh release create "$TAG" "$ASSET" -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_REF_NAME" --title "$TITLE" --notes-file release-notes.md
          else
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file release-notes.md
            gh release upload "$TAG" "$ASSET" --clobber -R "$GITHUB_REPOSITORY"
          fi

          # One asset per release: drop superseded r-numbered APKs
          for id in $(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets \
                      -q '.assets[] | select(.name != "'"$ASSET"'") | (.id|tostring)' || true); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
          done

          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json tagName,name,assets \
            -q '"RELEASE " + .tagName + " | " + .name + " | " + ([.assets[].name] | join(", "))'

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build ios --release --no-codesign --no-pub

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          cache: true
      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Write dart_defines.json
        env:
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
        run: jq -n --arg k "$GIPHY_API_KEY" '{GIPHY_API_KEY:$k}' > dart_defines.json
      - name: Enable native assets (bundles sqlite3 + llamadart libs, #445)
        run: flutter config --enable-native-assets
      - run: flutter build linux --release --no-pub --dart-define-from-file=dart_defines.json
      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: offband-linux-r${{ github.run_number }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/linux/x64/release/bundle/
          if-no-files-found: error
          retention-days: 14

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Enable native assets (bundles sqlite3 + llamadart libs, #445)
        run: flutter config --enable-native-assets
      - run: flutter build macos --release --no-pub

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Write dart_defines.json
        env:
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
        run: jq -n --arg k "$GIPHY_API_KEY" '{GIPHY_API_KEY:$k}' > dart_defines.json
      - run: flutter build web --release --no-pub --dart-define-from-file=dart_defines.json
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: offband-web-r${{ github.run_number }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/web/
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # Windows runner defaults to PowerShell; jq is not guaranteed there,
      # so build the JSON with ConvertTo-Json, which escapes correctly.
      - name: Write dart_defines.json
        env:
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
        run: |
          @{ GIPHY_API_KEY = $env:GIPHY_API_KEY } | ConvertTo-Json -Compress |
            Set-Content -Path dart_defines.json -Encoding utf8 -NoNewline
      - name: Enable native assets (bundles sqlite3 + llamadart libs, #445)
        run: flutter config --enable-native-assets
      - run: flutter build windows --release --no-pub --dart-define-from-file=dart_defines.json
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: offband-windows-r${{ github.run_number }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
